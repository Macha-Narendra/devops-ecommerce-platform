{% extends "base.html" %}

{% block content %}

<h2>Products</h2>

<form method="get">

    <input
        type="text"
        name="search"
        value="{{ search }}"
        placeholder="Search products">

    <button type="submit">
        Search
    </button>

</form>

<hr>

{% for product in products %}

<div class="card mb-3">

    <div class="card-body">

        <h5>
            {{ product.name }}
        </h5>

        <p>
            ₹{{ product.price }}
        </p>

        <a
         href="{% url 'product_detail' product.pk %}">
            View
        </a>

    </div>

</div>

{% empty %}

<p>No products found.</p>

{% endfor %}

{% endblock %}
